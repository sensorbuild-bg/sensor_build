name: Import bathroom media for preview

on:
  push:
    branches:
      - preview/site-improvements-2026-11-10
    paths:
      - .github/workflows/import-bathroom-media.yml

permissions:
  contents: write

jobs:
  import-bathroom:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch authentic video and 360 panorama, optimize for website
        env:
          SOURCE_VIDEO: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/db5e28c3-9195-4e4d-9cf5-7528cc15857d.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2ViYWQ2OGM3MDMyNDlhOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQzNTIxMn0.-fCzZ4gmeO42cLOpKwgWt7L8H_bq-8Z7r4TMbGIXaBg'
          SOURCE_PANORAMA: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/891141d4-5844-4722-a2a0-3dd9a538df4e.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmY2MmY2YzNjODgwZmQ2MyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ5MjM1NX0._KGm7-K22k4bO8lQN0t7vkyKZ3UONeywig8XWN86du4'
        run: |
          set -euo pipefail
          mkdir -p public/projects/bathroom
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_VIDEO" -o public/projects/bathroom/sensorbuild-bathroom-loop.mp4
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_PANORAMA" -o /tmp/sensorbuild-bathroom-360-original.jpg
          ffmpeg -hide_banner -loglevel error -y -i public/projects/bathroom/sensorbuild-bathroom-loop.mp4 -an -c:v libvpx-vp9 -b:v 0 -crf 33 -deadline good -cpu-used 4 -row-mt 1 -pix_fmt yuv420p public/projects/bathroom/sensorbuild-bathroom-loop.webm
          ffmpeg -hide_banner -loglevel error -y -i public/projects/bathroom/sensorbuild-bathroom-loop.mp4 -frames:v 1 -c:v libwebp -quality 84 public/projects/bathroom/sensorbuild-bathroom-loop-poster.webp
          ffmpeg -hide_banner -loglevel error -y -i /tmp/sensorbuild-bathroom-360-original.jpg -frames:v 1 -c:v libwebp -quality 85 public/projects/bathroom/sensorbuild-bathroom-360.webp
          test -s public/projects/bathroom/sensorbuild-bathroom-loop.webm
          test -s public/projects/bathroom/sensorbuild-bathroom-loop.mp4
          test -s public/projects/bathroom/sensorbuild-bathroom-loop-poster.webp
          test -s public/projects/bathroom/sensorbuild-bathroom-360.webp
      - name: Commit preview-only media to GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/bathroom/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import real bathroom media for looping homepage showcase [skip ci]"
            git push origin HEAD:preview/site-improvements-2026-11-10
          fi
