name: Prepare real bathroom project photo gallery
on:
  push:
    branches:
      - preview/site-improvements-2026-11-10
    paths:
      - .github/workflows/prepare-bathroom-gallery.yml

permissions:
  contents: write

jobs:
  make-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract authentic still frames from existing bathroom video
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p public/projects/bathroom/gallery
          for time in 02 05 08 11 14 16; do
            ffmpeg -hide_banner -loglevel error -y -ss "$time" -i public/projects/bathroom/sensorbuild-bathroom-loop.mp4 -frames:v 1 -an -c:v libwebp -quality 87 -compression_level 5 "public/projects/bathroom/gallery/frame-$time.webp"
            test -s "public/projects/bathroom/gallery/frame-$time.webp"
          done
      - name: Commit photo gallery in preview branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/bathroom/gallery/
          if ! git diff --cached --quiet; then
            git commit -m "assets: add real photos extracted from bathroom footage [skip ci]"
            git push origin HEAD:preview/site-improvements-2026-11-10
          fi
